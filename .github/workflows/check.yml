name: Verify saved artifacts
on: [push, pull_request, workflow_dispatch]
jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: project/requirements.txt
      - run: python -m pip install -r project/requirements.txt
      - run: python project/verify_final.py
      - run: python scripts/test_app.py
      - run: python experiments/tuning_v1/verify.py
